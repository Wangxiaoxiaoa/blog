{{ if .Site.Params.comments.enabled }}
<section class="comments" style="margin-top:2rem;border-top:1px solid var(--card-border);padding-top:2rem;">
  <script src="https://giscus.app/client.js"
    data-repo="Wangxiaoxiaoa/Wangxiaoxiaoa"
    data-repo-id="REPLACE_WITH_REPO_ID"
    data-category="Announcements"
    data-category-id="REPLACE_WITH_CATEGORY_ID"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="preferred_color_scheme"
    data-lang="zh-CN"
    data-loading="lazy"
    crossorigin="anonymous"
    async>
  </script>
</section>
{{ end }}
